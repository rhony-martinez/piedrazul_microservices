# Perfil Docker: configuracion completa para contenedores
spring.application.name=usuarios-service
server.port=8081

spring.datasource.url=jdbc:postgresql://postgres:5432/piedrazul_usuarios
spring.datasource.username=${POSTGRES_USER:piedrazul}
spring.datasource.password=${POSTGRES_PASSWORD:db_piedrazul}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

personas.service.url=http://personas-service:8082

piedrazul.keycloak.admin.url=http://keycloak:8080
piedrazul.keycloak.admin.realm=piedrazul
piedrazul.keycloak.admin.client-id=piedrazul-admin-cli
piedrazul.keycloak.admin.client-secret=${PIEDRAZUL_KEYCLOAK_ADMIN_CLIENT_SECRET:piedrazul-admin-secret}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.com.piedrazul.usuarios=INFO
