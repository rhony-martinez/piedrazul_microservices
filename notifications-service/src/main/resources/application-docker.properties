# Perfil Docker: configuracion completa para contenedores
spring.application.name=notifications-service
server.port=8084

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.exchange.citas=citas.exchange
rabbitmq.queue.cita-agendada=cita.agendada.queue
rabbitmq.queue.cita-cancelada=cita.cancelada.queue
rabbitmq.routing.cita-agendada=cita.agendada
rabbitmq.routing.cita-cancelada=cita.cancelada

citas.service.url=http://citas-service:8083

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.com.piedrazul.notifications=INFO
