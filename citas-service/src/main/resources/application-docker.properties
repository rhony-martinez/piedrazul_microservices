# Perfil Docker: configuracion completa para contenedores
spring.application.name=citas-service
server.port=8083

spring.datasource.url=jdbc:postgresql://postgres:5432/piedrazul_citas
spring.datasource.username=${POSTGRES_USER:piedrazul}
spring.datasource.password=${POSTGRES_PASSWORD:db_piedrazul}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.exchange.citas=citas.exchange
rabbitmq.exchange.personas=personas.exchange
rabbitmq.routing.cita-agendada=cita.agendada
rabbitmq.routing.cita-cancelada=cita.cancelada
rabbitmq.routing.cita-reagendada=cita.reagendada
rabbitmq.queue.paciente-creado=paciente.creado.queue
rabbitmq.queue.paciente-actualizado=paciente.actualizado.queue
rabbitmq.queue.medico-creado=medico.creado.queue
rabbitmq.queue.medico-actualizado=medico.actualizado.queue
rabbitmq.queue.disponibilidad-actualizada=disponibilidad.actualizada.queue
rabbitmq.queue.disponibilidad-eliminada=disponibilidad.eliminada.queue
rabbitmq.queue.disponibilidad-modificada=disponibilidad.modificada.queue

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.com.piedrazul.citas=INFO
logging.level.org.springframework.amqp=INFO
