# Perfil Docker: configuracion completa para contenedores
spring.application.name=personas-service
server.port=8082

spring.datasource.url=jdbc:postgresql://postgres:5432/piedrazul_personas
spring.datasource.username=${POSTGRES_USER:piedrazul}
spring.datasource.password=${POSTGRES_PASSWORD:db_piedrazul}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.exchange.personas=personas.exchange
citas.service.url=http://citas-service:8083

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.com.piedrazul.personas=INFO
